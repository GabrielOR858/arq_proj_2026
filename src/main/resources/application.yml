spring:
  application:
    name: trokr

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trokr_db}
    username: ${DB_USER:trokr_user}
    password: ${DB_PASSWORD:changeme_local_dev}

  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:trokr_logs}
    username: ${MONGO_USER:trokr}
    password: ${MONGO_PASSWORD:trokr123}
